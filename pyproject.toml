[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "llm-tally"
version = "0.1.0"
description = "Zero-dependency Python LLM toolkit with self-evicting in-memory caching, smart 5xx/network retries, per-feature cost tracking, and an interactive HTML dashboard."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Fauzi Azzam" }
]
keywords = [
    "llm",
    "ai",
    "cache",
    "retry",
    "cost-tracking",
    "openai",
    "anthropic",
    "gemini",
    "observability",
    "dashboard",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/pal-masgit-hub/llm-tally"
Repository = "https://github.com/pal-masgit-hub/llm-tally"
Issues = "https://github.com/pal-masgit-hub/llm-tally/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_tally"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
