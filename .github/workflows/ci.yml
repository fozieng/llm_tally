name: CI Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v


  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check wheel contains templates and py.typed, and the CLI runs
        run: |
          python - <<'PY'
          import glob, zipfile
          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          required = {
              "llm_tally/py.typed",
              "llm_tally/templates/dashboard.html",
              "llm_tally/templates/dashboard.css",
              "llm_tally/templates/dashboard.js",
          }
          missing = required - names
          assert not missing, f"wheel is missing {missing}"
          PY
          python -m pip install dist/*.whl
          cd /tmp && llm-tally report && llm-tally dashboard --out /tmp/dash.html
