name: Publish to PyPI

# Runs when a GitHub Release is published (e.g. tag v0.2.0).
# Uses PyPI Trusted Publishing, so no API token is stored in the repo.
# One-time setup: on pypi.org add a "pending publisher" for project `llm-tally`
# with owner `fozieng`, repository `llm_tally`, workflow `publish.yml`, environment `pypi`.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          pkg=$(PYTHONPATH=src python -c "import llm_tally; print(llm_tally.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          test "$pkg" = "$tag" || { echo "Tag $GITHUB_REF_NAME does not match version $pkg"; exit 1; }
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llm-tally/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
